server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/octet-stream text/css image/svg+xml;

    # Content hashes make these safe to cache across app restarts and deploys.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /models/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
