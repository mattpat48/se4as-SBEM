apiVersion: 1
groups:
  - orgId: 1
    name: IoT Sensor Alerts
    folder: IoT Alerts
    interval: 1m
    rules:
      # ─── Temperature Alert ───
      - uid: iot-temperature-alert
        title: "🌡️ High Temperature"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P1809F7CD0C757291
            model:
              refId: A
              query: |
                from(bucket: "iot_bucket")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "sensors" and r._field == "value" and r.type == "temperature")
                  |> group()
                  |> mean()
                  |> keep(columns: ["_value"])
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 30
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: warning
          sensor_type: temperature
        annotations:
          summary: "Temperature exceeds 30°C threshold"
          description: "Average temperature has exceeded the 30°C safety threshold for more than 2 minutes"

